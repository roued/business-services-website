<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل | Business Services</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <nav class="navbar">
            <div class="container">
                <div class="navbar-brand">
                    <a href="index.html" class="logo">
                        <i class="fas fa-briefcase"></i>
                        <span>خدمات الأعمال</span>
                    </a>
                </div>
            </div>
        </nav>
    </header>

    <!-- Register Section -->
    <section class="auth-section">
        <div class="auth-container">
            <div class="auth-box register-box">
                <h2>إنشاء حساب</h2>
                <p>تسجيل جديد في منصتنا</p>

                <form id="register-form" class="auth-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label>الاسم الأول</label>
                            <input type="text" name="first_name" required class="form-input">
                        </div>
                        <div class="form-group">
                            <label>الاسم الأخير</label>
                            <input type="text" name="last_name" required class="form-input">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>البريد الإلكتروني</label>
                        <input type="email" name="email" required class="form-input">
                    </div>
                    <div class="form-group">
                        <label>رقم الجوال</label>
                        <input type="tel" name="phone" class="form-input">
                    </div>
                    <div class="form-group">
                        <label>اسم الشركة</label>
                        <input type="text" name="company_name" class="form-input">
                    </div>
                    <div class="form-group">
                        <label>كلمة المرور</label>
                        <input type="password" name="password" required class="form-input">
                    </div>
                    <div class="form-group">
                        <label>تأكيد كلمة المرور</label>
                        <input type="password" name="confirm_password" required class="form-input">
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">تسجيل</button>
                </form>

                <p class="auth-link">هل لديك حساب بالفعل؟ <a href="login.html">دخول</a></p>
            </div>
        </div>
    </section>

    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
